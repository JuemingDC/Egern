name: WeTalk 自动化签到+视频奖励
description: |-
  WeTalk 自动化签到与视频奖励模块，Egern 格式。
  启用模块后，先打开 WeTalk 触发 api.wetalkapp.com/app/queryBalanceAndBonus 请求完成抓取；
  随后定时任务每天 08:20 与 20:20 自动执行签到和视频奖励。
author: TG@ZenMoFiShi / Egern rewrite by ChatGPT

scriptings:
  - http_request:
      name: WeTalk Capture
      match: "^https:\\/\\/api\\.wetalkapp\\.com\\/app\\/queryBalanceAndBonus(?:\\?.*)?$"
      script_url: https://raw.githubusercontent.com/JuemingDC/Egern/refs/heads/main/JavaScript/Wetalk/Wetalk_capture.js
      update_interval: 86400
      timeout: 30
      body_required: false

  - schedule:
      name: WeTalk Check-in
      cron: "20 8,20 * * *"
      script_url: https://raw.githubusercontent.com/JuemingDC/Egern/refs/heads/main/JavaScript/Wetalk/Wetalk_task.js
      update_interval: 86400
      timeout: 600

mitm:
  hostnames:
    includes:
      - api.wetalkapp.com

http_captures:
  - api.wetalkapp.com
